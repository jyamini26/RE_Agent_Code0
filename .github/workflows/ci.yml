name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Active LTS and current, so a native dependency breaking on one is
        # visible before it reaches anyone cloning the repo.
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # apps/* import @reap/shared from its build output, so the shared package
      # must be compiled before anything else typechecks.
      - name: Build shared contracts
        run: npm run build --workspace=@reap/shared

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test --workspaces --if-present

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The repository is kept at zero known advisories; a new one should fail
      # the build rather than sit unnoticed in the lockfile.
      - name: Audit
        run: npm audit --audit-level=moderate

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Proves the built artefact boots, seeds, ingests, and serves a real
      # request. A green unit suite with a broken entrypoint is a false pass.
      - name: Boot the API and exercise it
        run: |
          node apps/api/dist/index.js &
          SERVER_PID=$!

          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null; then break; fi
            sleep 1
          done

          curl -sf http://localhost:3001/api/health | tee /dev/stderr | grep -q '"status":"ok"'

          # The simulated inbox must have produced a pending queue on boot.
          PENDING=$(curl -sf 'http://localhost:3001/api/activities?status=pending' \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).meta.total))')
          echo "pending activities: $PENDING"
          test "$PENDING" -gt 0

          kill $SERVER_PID
